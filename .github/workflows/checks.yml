name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: ⚡️ Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Python version comes from .python-version

      - name: 📦 Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml
        run: uv sync --locked

      - name: 🎨 Format check
        run: uv run --frozen ruff format --check .

      - name: 🧹 Lint
        run: uv run --frozen ruff check --output-format=github .

      - name: 🧠 Type check
        run: uv run --frozen mypy

      - name: 🧪 Test
        run: uv run --frozen pytest
