[project]
name = "tnl-benchmarks"
version = "0.1.0"
description = "Automated execution, storage and regression analysis of TNL benchmarks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17",
    "asyncpg>=0.30",
    "fastapi~=0.116.1",
    "pydantic~=2.12.4",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]~=2.0.44",
    "uvicorn~=0.35.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
# Not a distributable package, just an application: don't try to build/install it.
package = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
show_error_context = true
show_error_codes = true
# FastAPI route decorators are untyped
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
